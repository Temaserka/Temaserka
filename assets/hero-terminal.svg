<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="100%" height="340">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070B"/>
      <stop offset="50%" stop-color="#090D16"/>
      <stop offset="100%" stop-color="#05070B"/>
    </linearGradient>
    <linearGradient id="emerald" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FF9D"/>
      <stop offset="100%" stop-color="#00B8FF"/>
    </linearGradient>
    <linearGradient id="alphaFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00FF9D" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#00FF9D" stop-opacity="0.0"/>
    </linearGradient>
    <linearGradient id="wbGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#CB11AB"/>
      <stop offset="100%" stop-color="#7B2CBF"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#141E30" stroke-width="0.7"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .title { font-size: 26px; font-weight: 800; fill: #F8FAFC; letter-spacing: 1.5px; }
    .sub { font-size: 12.5px; font-weight: 600; fill: #00FF9D; letter-spacing: 2px; }
    .muted { font-size: 11px; fill: #64748B; }
    .val { font-size: 12px; font-weight: 700; fill: #E2E8F0; }
    .tag { font-size: 10.5px; font-weight: 700; fill: #00FF9D; }
    .pulse { animation: blink 2s infinite ease-in-out; }
    .scan { animation: scanline 6s linear infinite; }
    .dash { stroke-dasharray: 420; stroke-dashoffset: 420; animation: draw 4s ease-out infinite alternate; }
    .bar1 { animation: b1 1.8s ease-in-out infinite alternate; }
    .bar2 { animation: b2 1.4s ease-in-out infinite alternate; }
    .bar3 { animation: b3 2.1s ease-in-out infinite alternate; }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }
    @keyframes scanline { 0% { transform: translateY(0px); } 100% { transform: translateY(340px); } }
    @keyframes draw { 0% { stroke-dashoffset: 420; } 100% { stroke-dashoffset: 0; } }
    @keyframes b1 { 0% { width: 45px; } 100% { width: 110px; } }
    @keyframes b2 { 0% { width: 85px; } 100% { width: 35px; } }
    @keyframes b3 { 0% { width: 60px; } 100% { width: 125px; } }
  </style>

  <!-- Background & Grid -->
  <rect width="900" height="340" rx="12" fill="url(#bg)" stroke="#1E293B" stroke-width="1.5"/>
  <rect width="900" height="340" rx="12" fill="url(#grid)" opacity="0.65"/>
  <line x1="0" y1="0" x2="900" y2="0" stroke="url(#emerald)" stroke-width="2" class="scan" opacity="0.22"/>

  <!-- Top Institutional Bar -->
  <rect x="1" y="1" width="898" height="32" rx="11" fill="#0B101B" stroke="#1E293B" stroke-width="1"/>
  <circle cx="20" cy="17" r="5" fill="#EF4444"/>
  <circle cx="36" cy="17" r="5" fill="#F59E0B"/>
  <circle cx="52" cy="17" r="5" fill="#10B981"/>
  <text x="74" y="21" class="mono muted">ALADDIN-CORE // TERMINAL v4.8 — RU-MOSCOW-QUANT-NODE</text>
  <circle cx="755" cy="17" r="4" fill="#00FF9D" class="pulse" filter="url(#glow)"/>
  <text x="766" y="21" class="mono tag">LIVE EXECUTION</text>

  <!-- Animated Ticker Tape -->
  <rect x="1" y="33" width="898" height="24" fill="#070B12" stroke="#141E30" stroke-width="1"/>
  <g class="mono" font-size="10.5" fill="#94A3B8">
    <text x="18" y="49">
      <tspan fill="#00FF9D">▲ AI.MEDIA.NET</tspan> 9 PLATFORMS / 24x7   |   <tspan fill="#CB11AB">★ WILDBERRIES</tspan> 3Y HIGHLOAD   |   <tspan fill="#38BDF8">⚡ HFT.ORDERBOOK</tspan> &lt;0.8ms   |   <tspan fill="#F59E0B">◆ FINTECH.RU</tspan> ALPHA +EDISCLOSURE   |   <tspan fill="#00FF9D">● BMSTU</tspan> ENG
    </text>
  </g>

  <!-- Left Panel: Identity & Executive Summary -->
  <g transform="translate(28, 86)">
    <text x="0" y="0" class="mono sub">EXECUTIVE PROFILE // QUANT &amp; MEDIA SYNDICATE</text>
    <text x="0" y="34" class="sans title">TIMOFEY SNETKOV</text>
    <rect x="275" y="15" width="118" height="22" rx="4" fill="#0D1F1D" stroke="#00FF9D" stroke-width="1"/>
    <text x="285" y="30" class="mono tag">@TEMASERKA</text>

    <text x="0" y="62" class="mono val" fill="#CBD5E1">
      AI Media Mogul • HFT &amp; FinTech Architect (RU) • Ex-Wildberries (3Y)
    </text>

    <!-- Key Badges -->
    <g transform="translate(0, 80)">
      <rect x="0" y="0" width="165" height="28" rx="5" fill="#190A24" stroke="#CB11AB" stroke-width="1.2"/>
      <text x="12" y="18" class="mono" font-size="11" font-weight="700" fill="#F0ABFC">WILDBERRIES // 3 YEARS</text>

      <rect x="175" y="0" width="155" height="28" rx="5" fill="#081C18" stroke="#00FF9D" stroke-width="1.2"/>
      <text x="187" y="18" class="mono" font-size="11" font-weight="700" fill="#00FF9D">AI MEDIA EMPIRE</text>

      <rect x="340" y="0" width="165" height="28" rx="5" fill="#0A1929" stroke="#38BDF8" stroke-width="1.2"/>
      <text x="352" y="18" class="mono" font-size="11" font-weight="700" fill="#38BDF8">HFT &amp; FINTECH RU</text>
    </g>

    <!-- Terminal Readout Lines -->
    <g transform="translate(0, 128)" class="mono" font-size="11.5">
      <text x="0" y="0" fill="#94A3B8">&gt; <tspan fill="#00FF9D">media_holding:</tspan> Autonomous AI video factories &amp; multi-million reach networks</text>
      <text x="0" y="22" fill="#94A3B8">&gt; <tspan fill="#38BDF8">quant_fintech:</tspan> Orderbook density, MOEX/Crypto HFT &amp; e-disclosure alpha</text>
      <text x="0" y="44" fill="#94A3B8">&gt; <tspan fill="#F0ABFC">wb_experience:</tspan> 3 years building high-load e-commerce &amp; data systems</text>
      <text x="0" y="66" fill="#94A3B8">&gt; <tspan fill="#F59E0B">direct_comms :</tspan> <tspan fill="#F8FAFC" font-weight="700">timofeysnetkov@yandex.ru</tspan> <tspan fill="#00FF9D" class="pulse">▊</tspan></text>
    </g>
  </g>

  <!-- Right Panel: Live Alpha & Orderbook Telemetry -->
  <g transform="translate(565, 72)">
    <rect x="0" y="0" width="310" height="244" rx="8" fill="#070B12" stroke="#1E293B" stroke-width="1.2"/>
    <text x="16" y="24" class="mono muted">PORTFOLIO ALPHA &amp; MEDIA VELOCITY</text>
    <text x="235" y="24" class="mono tag">+342.8% ▲</text>

    <!-- Equity Curve Chart -->
    <g transform="translate(16, 38)">
      <line x1="0" y1="0" x2="278" y2="0" stroke="#141E30" stroke-width="1"/>
      <line x1="0" y1="35" x2="278" y2="35" stroke="#141E30" stroke-width="1"/>
      <line x1="0" y1="70" x2="278" y2="70" stroke="#141E30" stroke-width="1"/>
      <line x1="0" y1="105" x2="278" y2="105" stroke="#141E30" stroke-width="1"/>

      <path d="M 0 98 L 35 88 L 70 92 L 105 68 L 140 72 L 175 44 L 210 49 L 245 22 L 278 8 L 278 105 L 0 105 Z" fill="url(#alphaFill)"/>
      <path d="M 0 98 L 35 88 L 70 92 L 105 68 L 140 72 L 175 44 L 210 49 L 245 22 L 278 8" fill="none" stroke="url(#emerald)" stroke-width="2.5" class="dash" filter="url(#glow)"/>
      <circle cx="278" cy="8" r="4.5" fill="#00FF9D" class="pulse" filter="url(#glow)"/>
    </g>

    <!-- Live Orderbook / Cluster Bars -->
    <g transform="translate(16, 160)" class="mono" font-size="10">
      <text x="0" y="0" fill="#64748B">L2 ORDERBOOK DENSITY &amp; GPU CLUSTER LOAD</text>

      <text x="0" y="20" fill="#94A3B8">BID/LIQ</text>
      <rect x="62" y="11" width="110" height="9" rx="2" fill="#00FF9D" opacity="0.85" class="bar1"/>
      <text x="215" y="20" fill="#00FF9D">99.4% FILL</text>

      <text x="0" y="38" fill="#94A3B8">ASK/VOL</text>
      <rect x="62" y="29" width="85" height="9" rx="2" fill="#38BDF8" opacity="0.85" class="bar2"/>
      <text x="215" y="38" fill="#38BDF8">0.4ms RTT</text>

      <text x="0" y="56" fill="#94A3B8">AI PIPE</text>
      <rect x="62" y="47" width="125" height="9" rx="2" fill="#CB11AB" opacity="0.9" class="bar3"/>
      <text x="215" y="56" fill="#F0ABFC">24/7 AUTO</text>
    </g>
  </g>
</svg>
