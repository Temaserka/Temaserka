<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 245" width="100%" height="245">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#090D16"/>
      <stop offset="100%" stop-color="#04060A"/>
    </linearGradient>
    <linearGradient id="wbBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#CB11AB"/>
      <stop offset="100%" stop-color="#F0ABFC"/>
    </linearGradient>
    <linearGradient id="aiBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FF9D"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="hftBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .hdr { font-size: 13.5px; font-weight: 800; fill: #F8FAFC; letter-spacing: 0.5px; }
    .role { font-size: 10.5px; font-weight: 700; letter-spacing: 1px; }
    .item { font-size: 11px; fill: #94A3B8; }
    .stat { font-size: 17px; font-weight: 800; }
    .pulse { animation: p 2.2s infinite ease-in-out; }
    @keyframes p { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
  </style>

  <!-- Card 1: WILDBERRIES (3 YEARS) -->
  <g transform="translate(0, 6)">
    <rect x="2" y="0" width="286" height="232" rx="10" fill="url(#cardBg)" stroke="#4A155B" stroke-width="1.5"/>
    <rect x="2" y="0" width="286" height="4" rx="2" fill="url(#wbBar)"/>
    <circle cx="266" cy="24" r="4" fill="#E879F9" class="pulse"/>
    <text x="20" y="27" class="mono role" fill="#E879F9">01 // WILDBERRIES (3 YEARS)</text>
    <text x="20" y="50" class="sans hdr">Full-Stack • Sys &amp; Biz Analyst</text>

    <text x="20" y="78" class="mono item">• End-to-End Full-Stack Engineering</text>
    <text x="20" y="98" class="mono item">• Systems Architecture &amp; API Design</text>
    <text x="20" y="118" class="mono item">• Business Analysis &amp; Unit Economics</text>
    <text x="20" y="138" class="mono item">• High-Load Core at Tens of Millions RPS</text>
    <text x="20" y="158" class="mono item">• Cross-Team Product &amp; Tech Leadership</text>

    <line x1="20" y1="176" x2="268" y2="176" stroke="#1E293B" stroke-width="1"/>
    <text x="20" y="201" class="mono stat" fill="#F0ABFC">3 YEARS // FULL-CYCLE</text>
    <text x="20" y="218" class="mono" font-size="9.5" fill="#64748B">DEV + SYSTEM + BUSINESS ARCHITECTURE</text>
  </g>

  <!-- Card 2: AI MEDIA MOGUL -->
  <g transform="translate(306, 6)">
    <rect x="0" y="0" width="288" height="232" rx="10" fill="url(#cardBg)" stroke="#0D3B2E" stroke-width="1.5"/>
    <rect x="0" y="0" width="288" height="4" rx="2" fill="url(#aiBar)"/>
    <circle cx="266" cy="24" r="4" fill="#00FF9D" class="pulse"/>
    <text x="20" y="27" class="mono role" fill="#00FF9D">02 // AI MEDIA HOLDING</text>
    <text x="20" y="50" class="sans hdr">Founder &amp; AI Media Mogul</text>

    <text x="20" y="78" class="mono item">• Proprietary Autonomous Media Assets</text>
    <text x="20" y="98" class="mono item">• Generative AI Content Ecosystems</text>
    <text x="20" y="118" class="mono item">• Multi-Million Viral Audience Scale</text>
    <text x="20" y="138" class="mono item">• High-Margin Digital Media Portfolio</text>
    <text x="20" y="158" class="mono item">• Closed-Loop Distribution [NDA]</text>

    <line x1="20" y1="176" x2="268" y2="176" stroke="#1E293B" stroke-width="1"/>
    <text x="20" y="201" class="mono stat" fill="#00FF9D">100M+ ORGANIC REACH</text>
    <text x="20" y="218" class="mono" font-size="9.5" fill="#64748B">PROPRIETARY AI MEDIA INFRASTRUCTURE</text>
  </g>

  <!-- Card 3: HFT & FINTECH RUSSIA -->
  <g transform="translate(612, 6)">
    <rect x="0" y="0" width="286" height="232" rx="10" fill="url(#cardBg)" stroke="#12324F" stroke-width="1.5"/>
    <rect x="0" y="0" width="286" height="4" rx="2" fill="url(#hftBar)"/>
    <circle cx="266" cy="24" r="4" fill="#38BDF8" class="pulse"/>
    <text x="20" y="27" class="mono role" fill="#38BDF8">03 // HFT &amp; FINTECH (RU)</text>
    <text x="20" y="50" class="sans hdr">Quantitative &amp; FinTech Systems</text>

    <text x="20" y="78" class="mono item">• Ultra-Low-Latency Execution Core</text>
    <text x="20" y="98" class="mono item">• Quantitative Market Microstructure</text>
    <text x="20" y="118" class="mono item">• Algorithmic Liquidity &amp; Alpha Desk</text>
    <text x="20" y="138" class="mono item">• Institutional Risk &amp; Capital Models</text>
    <text x="20" y="158" class="mono item">• Proprietary Trading IP [NDA]</text>

    <line x1="20" y1="176" x2="268" y2="176" stroke="#1E293B" stroke-width="1"/>
    <text x="20" y="201" class="mono stat" fill="#38BDF8">SUB-MS // QUANT ALPHA</text>
    <text x="20" y="218" class="mono" font-size="9.5" fill="#64748B">INSTITUTIONAL FINTECH &amp; HFT RUSSIA</text>
  </g>
</svg>
