<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="240">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#090D16"/>
      <stop offset="100%" stop-color="#05070B"/>
    </linearGradient>
    <linearGradient id="wbBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#CB11AB"/>
      <stop offset="100%" stop-color="#E879F9"/>
    </linearGradient>
    <linearGradient id="aiBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FF9D"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="hftBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .hdr { font-size: 14px; font-weight: 800; fill: #F8FAFC; letter-spacing: 0.8px; }
    .role { font-size: 11px; font-weight: 700; letter-spacing: 1px; }
    .item { font-size: 11px; fill: #94A3B8; }
    .stat { font-size: 18px; font-weight: 800; }
    .pulse { animation: p 2.4s infinite ease-in-out; }
    @keyframes p { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
  </style>

  <!-- Card 1: WILDBERRIES (3 YEARS) -->
  <g transform="translate(0, 6)">
    <rect x="2" y="0" width="286" height="226" rx="10" fill="url(#cardBg)" stroke="#3B1245" stroke-width="1.5"/>
    <rect x="2" y="0" width="286" height="4" rx="2" fill="url(#wbBar)"/>
    <circle cx="266" cy="24" r="4" fill="#E879F9" class="pulse"/>
    <text x="20" y="28" class="mono role" fill="#E879F9">01 // WILDBERRIES (3 YEARS)</text>
    <text x="20" y="52" class="sans hdr">High-Load &amp; AI Systems</text>

    <text x="20" y="82" class="mono item">• High-throughput microservices</text>
    <text x="20" y="102" class="mono item">• Distributed data &amp; ML pipelines</text>
    <text x="20" y="122" class="mono item">• Production fault-tolerant infra</text>
    <text x="20" y="142" class="mono item">• Tens of millions RPS ecosystem</text>

    <line x1="20" y1="165" x2="268" y2="165" stroke="#1E293B" stroke-width="1"/>
    <text x="20" y="192" class="mono stat" fill="#F0ABFC">3+ YEARS</text>
    <text x="20" y="210" class="mono" font-size="10" fill="#64748B">TIER-1 E-COMMERCE SCALE IN RUSSIA</text>
  </g>

  <!-- Card 2: AI MEDIA MOGUL -->
  <g transform="translate(306, 6)">
    <rect x="0" y="0" width="288" height="226" rx="10" fill="url(#cardBg)" stroke="#0D3B2E" stroke-width="1.5"/>
    <rect x="0" y="0" width="288" height="4" rx="2" fill="url(#aiBar)"/>
    <circle cx="266" cy="24" r="4" fill="#00FF9D" class="pulse"/>
    <text x="20" y="28" class="mono role" fill="#00FF9D">02 // AI MEDIA SYNDICATE</text>
    <text x="20" y="52" class="sans hdr">Autonomous Media Mogul</text>

    <text x="20" y="82" class="mono item">• Fully autonomous video factories</text>
    <text x="20" y="102" class="mono item">• Multi-agent LLM + Veo + Whisper</text>
    <text x="20" y="122" class="mono item">• 9-platform auto-publishing grid</text>
    <text x="20" y="142" class="mono item">• GPU/Colab render &amp; mobile farms</text>

    <line x1="20" y1="165" x2="268" y2="165" stroke="#1E293B" stroke-width="1"/>
    <text x="20" y="192" class="mono stat" fill="#00FF9D">100M+ VIEWS</text>
    <text x="20" y="210" class="mono" font-size="10" fill="#64748B">ZERO-HUMAN 24/7 CONTENT PIPELINE</text>
  </g>

  <!-- Card 3: HFT & FINTECH RUSSIA -->
  <g transform="translate(612, 6)">
    <rect x="0" y="0" width="286" height="226" rx="10" fill="url(#cardBg)" stroke="#12324F" stroke-width="1.5"/>
    <rect x="0" y="0" width="286" height="4" rx="2" fill="url(#hftBar)"/>
    <circle cx="266" cy="24" r="4" fill="#38BDF8" class="pulse"/>
    <text x="20" y="28" class="mono role" fill="#38BDF8">03 // HFT &amp; FINTECH (RU)</text>
    <text x="20" y="52" class="sans hdr">Quant &amp; Low-Latency</text>

    <text x="20" y="82" class="mono item">• L2/L3 orderbook density engines</text>
    <text x="20" y="102" class="mono item">• Intraday alpha &amp; stat-arb bots</text>
    <text x="20" y="122" class="mono item">• Corporate e-disclosure snipers</text>
    <text x="20" y="142" class="mono item">• MOEX / T-Bank / Crypto execution</text>

    <line x1="20" y1="165" x2="268" y2="165" stroke="#1E293B" stroke-width="1"/>
    <text x="20" y="192" class="mono stat" fill="#38BDF8">&lt; 1ms EXEC</text>
    <text x="20" y="210" class="mono" font-size="10" fill="#64748B">ALGORITHMIC TRADING &amp; MARKET DATA</text>
  </g>
</svg>
