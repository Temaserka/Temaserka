<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="240">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04060A"/>
      <stop offset="100%" stop-color="#090D16"/>
    </linearGradient>
    <linearGradient id="barEm" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FF9D"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="barWb" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#CB11AB"/>
      <stop offset="100%" stop-color="#F0ABFC"/>
    </linearGradient>
    <linearGradient id="barGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#FDE047"/>
    </linearGradient>
    <filter id="glow3" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feComposite in="SourceGraphic" in2="b" operator="over"/>
    </filter>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace; }
    .title { font-size: 11.5px; font-weight: 800; fill: #94A3B8; letter-spacing: 1.5px; }
    .lbl { font-size: 11px; font-weight: 700; fill: #E2E8F0; }
    .pct { font-size: 11px; font-weight: 800; fill: #00FF9D; }
    .pulse { animation: p 2s infinite ease-in-out; }
    @keyframes p { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
  </style>

  <rect width="900" height="240" rx="10" fill="url(#bg3)" stroke="#1E293B" stroke-width="1.5"/>
  <text x="24" y="28" class="mono title">EXECUTIVE COMPETENCY MATRIX • GLOBAL OPERATIONS • PROPRIETARY STACK</text>

  <!-- Left Panel: Competency Bars -->
  <g transform="translate(24, 48)">
    <text x="0" y="12" class="mono lbl">Full-Stack &amp; High-Load Architecture</text>
    <text x="290" y="12" class="mono pct">99%</text>
    <rect x="0" y="20" width="320" height="8" rx="4" fill="#111A2B"/>
    <rect x="0" y="20" width="314" height="8" rx="4" fill="url(#barEm)"/>

    <text x="0" y="50" class="mono lbl">Systems &amp; Business Analysis (WB 3Y)</text>
    <text x="290" y="50" class="mono pct" fill="#F0ABFC">99%</text>
    <rect x="0" y="58" width="320" height="8" rx="4" fill="#111A2B"/>
    <rect x="0" y="58" width="314" height="8" rx="4" fill="url(#barWb)"/>

    <text x="0" y="88" class="mono lbl">Quantitative HFT &amp; FinTech Systems</text>
    <text x="290" y="88" class="mono pct" fill="#38BDF8">97%</text>
    <rect x="0" y="96" width="320" height="8" rx="4" fill="#111A2B"/>
    <rect x="0" y="96" width="308" height="8" rx="4" fill="url(#barEm)"/>

    <text x="0" y="126" class="mono lbl">Autonomous AI &amp; Media Capital</text>
    <text x="290" y="126" class="mono pct" fill="#FDE047">99%</text>
    <rect x="0" y="134" width="320" height="8" rx="4" fill="#111A2B"/>
    <rect x="0" y="134" width="316" height="8" rx="4" fill="url(#barGold)"/>
  </g>

  <!-- Center Panel: Animated Rotating Aladdin Quantum Radar -->
  <g transform="translate(465, 114)">
    <circle r="58" fill="#060A12" stroke="#1E293B" stroke-width="1.5"/>
    <circle r="42" fill="none" stroke="#14263C" stroke-width="1" stroke-dasharray="4 4"/>
    <circle r="24" fill="none" stroke="#14263C" stroke-width="1"/>
    <line x1="-58" y1="0" x2="58" y2="0" stroke="#14263C" stroke-width="1"/>
    <line x1="0" y1="-58" x2="0" y2="58" stroke="#14263C" stroke-width="1"/>

    <g>
      <line x1="0" y1="0" x2="0" y2="-56" stroke="#00FF9D" stroke-width="2" filter="url(#glow3)"/>
      <path d="M 0 0 L 0 -56 A 56 56 0 0 1 48 -28 Z" fill="#00FF9D" opacity="0.18"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="4s" repeatCount="indefinite"/>
    </g>

    <circle cx="18" cy="-22" r="3.5" fill="#00FF9D" class="pulse" filter="url(#glow3)"/>
    <circle cx="-26" cy="16" r="3" fill="#38BDF8" class="pulse"/>
    <circle cx="22" cy="24" r="3" fill="#E879F9" class="pulse"/>
    <circle r="4" fill="#F8FAFC"/>
  </g>

  <!-- Right Panel: Global Languages & NDA Clearance -->
  <g transform="translate(560, 46)">
    <rect width="316" height="132" rx="8" fill="#060A12" stroke="#1E293B" stroke-width="1.2"/>
    <text x="16" y="24" class="mono" font-size="11" font-weight="800" fill="#FDE047">GLOBAL FLUENCY &amp; CLEARANCE</text>

    <text x="16" y="48" class="mono" font-size="11" fill="#94A3B8">• <tspan fill="#F8FAFC" font-weight="700">Russian :</tspan> Native Executive</text>
    <text x="16" y="68" class="mono" font-size="11" fill="#94A3B8">• <tspan fill="#00FF9D" font-weight="700">English :</tspan> C1 Advanced ( Quant / Tech )</text>
    <text x="16" y="88" class="mono" font-size="11" fill="#94A3B8">• <tspan fill="#F59E0B" font-weight="700">Chinese :</tspan> 中文 Mandarin ( APAC / CN )</text>
    <text x="16" y="108" class="mono" font-size="11" fill="#94A3B8">• <tspan fill="#38BDF8" font-weight="700">Security:</tspan> Proprietary IP // Closed NDA</text>
  </g>

  <!-- Bottom Stack Strip -->
  <rect x="24" y="190" width="852" height="36" rx="6" fill="#060911" stroke="#141E30" stroke-width="1"/>
  <g transform="translate(38, 212)" class="mono" font-size="10.5" font-weight="700">
    <text x="0" y="0" fill="#00FF9D">CORE //</text>
    <text x="64" y="0" fill="#E2E8F0">Python • Go • C++ • TypeScript • React • SQL/NoSQL • Kafka • Redis • Docker • Linux • System &amp; Business Architecture</text>
  </g>
</svg>
